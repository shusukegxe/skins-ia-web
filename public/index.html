<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skins IA</title>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('fonts/Monocraft.woff2') format('woff2');
    font-display: swap;
  }
  :root {
    --fondo: #17181c; --panel: #1e2025; --borde: #33363d; --borde-hi: #4a4e58;
    --verde: #7ac74f; --verde-osc: #2a4d1d; --texto: #e8e8e8; --gris: #9aa0a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--fondo); color: var(--texto);
    font-family: 'Minecraft', 'Segoe UI', monospace;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px 14px; font-size: 15px; line-height: 1.5;
  }
  header { width: 100%; max-width: 980px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  h1 { font-size: 1.4rem; letter-spacing: 1px; }
  h1 em { color: var(--verde); font-style: normal; }
  #estado { font-size: .75rem; color: var(--gris); }
  #estado::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--gris); margin-right: 6px; }
  #estado.ok { color: var(--verde); } #estado.ok::before { background: var(--verde); }
  main { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1fr 360px; gap: 16px; }
  @media (max-width: 780px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 2px solid var(--borde); padding: 16px; display: flex; flex-direction: column; }
  h2 { font-size: .95rem; color: var(--verde); margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
  #chat { height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding-right: 4px; }
  .msg { max-width: 85%; padding: 8px 12px; font-size: .85rem; white-space: pre-wrap; word-break: break-word; }
  .msg.yo { align-self: flex-end; background: var(--verde-osc); border: 2px solid var(--verde); color: #d9f2c8; }
  .msg.copilot { align-self: flex-start; background: #26282f; border: 2px solid var(--borde); }
  .msg img.skinchat { width: 110px; image-rendering: pixelated; margin-top: 8px; display: block; cursor: pointer; border: 2px solid var(--borde-hi); }
  #filaChat { display: flex; gap: 8px; }
  input, textarea, select, button {
    font: inherit; font-size: .85rem; background: #14151a; color: var(--texto);
    border: 2px solid var(--borde); padding: 9px 12px; border-radius: 0;
  }
  input:focus, textarea:focus { outline: 2px solid var(--verde); outline-offset: -2px; }
  #entradaChat { flex: 1; }
  button { cursor: pointer; }
  button:hover { border-color: var(--verde); color: var(--verde); }
  .primario { background: var(--verde); color: #14210c; border-color: var(--verde); font-weight: bold; }
  .primario:hover { background: #8edb61; color: #14210c; }
  #vista { width: 100%; height: 300px; background: #101116; border: 2px solid var(--borde); margin-bottom: 12px; }
  .fila { display: flex; gap: 8px; margin-bottom: 10px; } .fila > * { flex: 1; }
  label { font-size: .72rem; color: var(--gris); display: block; margin: 4px 0 4px; text-transform: uppercase; letter-spacing: 1px; }
  #nota { font-size: .7rem; color: var(--gris); margin-top: 10px; border-top: 2px solid var(--borde); padding-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Skins <em>IA</em></h1>
  <div id="estado">conectando</div>
</header>
<main>
  <section>
    <h2>Copilot</h2>
    <div id="chat"></div>
    <div id="filaChat">
      <input id="entradaChat" placeholder="ej: una skin de axolotl con gorra morada" autocomplete="off">
      <button class="primario" id="btnEnviar">Enviar</button>
    </div>
    <p id="nota">El copilot responde con kaomojis y tu skin. Aunque cierres la pagina, tu mensaje queda guardado y la respuesta te espera aqui al volver.</p>
  </section>
  <section>
    <h2>Generador rapido</h2>
    <canvas id="vista"></canvas>
    <div class="fila">
      <button id="btnCaminar">Caminar</button><button id="btnCorrer">Correr</button><button id="btnGirar">Girar</button>
    </div>
    <label>Describe tu skin (en ingles va mejor)</label>
    <textarea id="prompt" rows="3" placeholder="Minecraft skin, steve model, ..."></textarea>
    <div class="fila" style="margin-top:10px">
      <select id="modelo"><option value="steve">Steve (brazos gruesos)</option><option value="alex">Alex (brazos delgados)</option></select>
      <button class="primario" id="btnGenerar">Generar</button>
    </div>
    <div class="fila">
      <button id="btnDescargar" disabled>Descargar skin</button>
    </div>
    <p id="nota">Las skins se generan con IA en una GPU casera. Si no responde, el generador esta apagado.</p>
  </section>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3/bundles/skinview3d.bundle.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const API = (window.CONFIG && window.CONFIG.TUNNEL_URL || '').replace(/\/$/, '');
  const TOKEN = window.CONFIG ? window.CONFIG.SKIN_TOKEN : '';
  let visor, urlActual = null, sinWebGL = !(() => {
    try { const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) { return false; }
  })();

  function vista2D(urlSkin) {
    const v = $('vista');
    v.style.display = 'none';
    let img = document.getElementById('vista2d');
    if (!img) {
      img = document.createElement('img');
      img.id = 'vista2d';
      img.style.cssText = 'width:100%;height:300px;object-fit:contain;image-rendering:pixelated;background:#101116;border:2px solid var(--borde);margin-bottom:12px';
      v.parentNode.insertBefore(img, v);
      ['btnCaminar', 'btnCorrer', 'btnGirar'].forEach(id => $(id).disabled = true);
    }
    img.src = urlSkin;
    urlActual = urlSkin; $('btnDescargar').disabled = false;
  }

  function montarVisor(urlSkin) {
    if (sinWebGL) { vista2D(urlSkin); return; }
    if (visor) { visor.loadSkin(urlSkin); }
    else {
      visor = new skinview3d.SkinViewer({ canvas: $('vista'), width: 320, height: 300, skin: urlSkin });
      visor.zoom = 0.8; visor.autoRotate = true;
      visor.loadAnimation(new skinview3d.WalkingAnimation());
    }
    urlActual = urlSkin; $('btnDescargar').disabled = false;
  }
  $('btnCaminar').onclick = () => visor && visor.loadAnimation(new skinview3d.WalkingAnimation());
  $('btnCorrer').onclick = () => visor && visor.loadAnimation(new skinview3d.RunningAnimation());
  $('btnGirar').onclick = () => visor && visor.loadAnimation(new skinview3d.FlyingAnimation());
  $('btnDescargar').onclick = () => { if (!urlActual) return; const a = document.createElement('a'); a.href = urlActual; a.download = 'skin_ia.png'; a.click(); };

  if (!API) { $('estado').textContent = 'sin configurar (falta TUNNEL_URL)'; }
  else fetch(API + '/salud').then(r => r.json()).then(d => {
    $('estado').textContent = d.listo ? 'listo para generar' : 'servidor cargando';
    if (d.listo) $('estado').classList.add('ok');
  }).catch(() => { $('estado').textContent = 'generador apagado'; });

  $('btnGenerar').onclick = async () => {
    const prompt = $('prompt').value.trim();
    if (!prompt || !API) return;
    $('btnGenerar').disabled = true; $('btnGenerar').textContent = 'Generando...';
    try {
      const r = await fetch(API + '/generar', { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
        body: JSON.stringify({ prompt, modelo: $('modelo').value }) });
      if (!r.ok) throw 0;
      montarVisor(URL.createObjectURL(await r.blob()));
    } catch { alert('No se pudo generar. El generador esta encendido?'); }
    $('btnGenerar').disabled = false; $('btnGenerar').textContent = 'Generar';
  };

  function burbuja(clase, texto) {
    const d = document.createElement('div'); d.className = 'msg ' + clase;
    d.textContent = texto; $('chat').appendChild(d); $('chat').scrollTop = 1e9; return d;
  }
  async function enviarChat() {
    const texto = $('entradaChat').value.trim(); if (!texto || !API) return;
    $('entradaChat').value = '';
    burbuja('yo', texto);
    const esperando = burbuja('copilot', '...');
    try {
      const r = await fetch(API + '/mensaje', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto }) });
      const { id } = await r.json();
      if (!id) throw 0;
      poll(id, esperando, 0);
    } catch { esperando.textContent = 'x_x generador no disponible'; }
  }
  async function poll(id, burbujaEspera, intentos) {
    if (intentos > 450) { burbujaEspera.textContent = 'zzz tardo demasiado, pregunta luego'; return; }
    try {
      const r = await fetch(API + '/respuesta/' + id);
      const d = await r.json();
      if (d.lista) {
        burbujaEspera.textContent = d.respuesta ?? '...';
        if (d.skin) { const img = document.createElement('img'); img.className = 'skinchat';
          img.src = API + '/skins/' + encodeURIComponent(d.skin);
          img.onclick = () => montarVisor(img.src);
          burbujaEspera.appendChild(img); }
        return;
      }
    } catch {}
    setTimeout(() => poll(id, burbujaEspera, intentos + 1), 3000);
  }
  $('btnEnviar').onclick = enviarChat;
  $('entradaChat').addEventListener('keydown', e => { if (e.key === 'Enter') enviarChat(); });
</script>
</body>
</html>
