name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inyectar SKIN_TOKEN en config.js
        run: |
          python3 -c "import os, pathlib; p = pathlib.Path('public/config.js'); p.write_text(p.read_text(encoding='utf-8').replace('SKIN_TOKEN: \"\"', 'SKIN_TOKEN: \"' + os.environ['SKIN_TOKEN'] + '\"'), encoding='utf-8')"
        env:
          SKIN_TOKEN: ${{ secrets.SKIN_TOKEN }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
