name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inyectar token en config.js
        run: sed -i "s|SKIN_TOKEN: \"\"|SKIN_TOKEN: \"${SKIN_TOKEN}\"|" public/config.js
        env:
          SKIN_TOKEN: ${{ secrets.SKIN_TOKEN }}
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
